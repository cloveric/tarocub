    <rect x="188" y="493" width="86" height="27" rx="7" fill="#FFFFFF" fill-opacity="0.62"/>
    <text x="204" y="511" fill="#64748B" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600">Node.js</text>
    <rect x="286" y="493" width="134" height="27" rx="7" fill="#FFFFFF" fill-opacity="0.62"/>
    <text x="302" y="511" fill="#64748B" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600">Docs / Sheets</text>
