  <text x="80" y="225" fill="#1F2937" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="850" letter-spacing="-2.4">TaroCub</text>
  <text x="80" y="285" fill="#334155" font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="760" letter-spacing="-0.8">Local agents. Feishu/Lark-first.</text>
  <rect x="82" y="314" width="182" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="360" fill="#334155" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600">Codex, Claude Code, Kimi Code, and Antigravity run locally.</text>
  <text x="80" y="391" fill="#64748B" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="500">Feishu/Lark is primary. Telegram remains optional.</text>

