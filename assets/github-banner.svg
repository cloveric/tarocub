<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftFade" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7E6" stop-opacity="0.94"/>
      <stop offset="0.52" stop-color="#FFF7E6" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFF7E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="312" x2="260" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#7C5D2E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <image href="github-banner-art.png" x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
  <rect width="760" height="640" fill="url(#leftFade)"/>
  <rect width="1280" height="640" fill="#FFF7ED" fill-opacity="0.08"/>

  <g filter="url(#softShadow)">
    <rect x="80" y="95" width="158" height="34" rx="17" fill="#EDE9FE" fill-opacity="0.88" stroke="#8B5CF6" stroke-opacity="0.22"/>
    <text x="103" y="117" fill="#6D28D9" font-family="'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8">FEISHU/LARK</text>

    <rect x="252" y="95" width="140" height="34" rx="17" fill="#E0F7FA" fill-opacity="0.86" stroke="#0891B2" stroke-opacity="0.26"/>
