    <rect x="406" y="95" width="132" height="34" rx="17" fill="#FEF3C7" fill-opacity="0.9" stroke="#F59E0B" stroke-opacity="0.26"/>
    <text x="430" y="117" fill="#B45309" font-family="'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8">4 ENGINES</text>
